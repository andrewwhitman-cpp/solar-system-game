<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Orbits">
  <defs>
    <radialGradient id="starCore" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffd9a8"/>
      <stop offset="100%" stop-color="#e89450"/>
    </radialGradient>
    <linearGradient id="planet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Deep space -->
  <rect width="32" height="32" rx="7" fill="#070a12"/>
  <!-- Orbit ellipse -->
  <ellipse cx="16" cy="16" rx="12.5" ry="6.8" fill="none" stroke="#334155" stroke-width="1.25" opacity="0.95" transform="rotate(-22 16 16)"/>
  <!-- Central star -->
  <circle cx="16" cy="16" r="4.2" fill="url(#starCore)"/>
  <!-- Planet on orbit -->
  <circle cx="25.5" cy="11.2" r="2.35" fill="url(#planet)"/>
</svg>
